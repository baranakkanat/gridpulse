[project]
name = "gridpulse"
version = "0.1.0"
description = "Explainable electricity load forecasting and machine learning reliability research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    # pandapower (grid extra) currently supports pandas ~2.3 and numpy < 2.5 only.
    "numpy>=2.0,<2.5",
    "pandas>=2.3,<3",
]

[project.optional-dependencies]
grid = [
    "pandapower~=3.5.6",
    "simbench~=1.6.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# archived audit scripts (Phase 4 provenance), kept verbatim
extend-exclude = ["docs/provenance"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD"]
