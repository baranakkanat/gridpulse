[project]
name = "gridpulse"
version = "0.1.0"
description = "Explainable electricity load forecasting and machine learning reliability research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.0",
    "pandas>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD"]
