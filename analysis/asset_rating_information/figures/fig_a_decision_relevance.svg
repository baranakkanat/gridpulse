<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1324" height="466" viewBox="0 0 1324 466" role="img">
<title>A - Decision relevance of the rating uncertainty</title>
<desc>Protocol s. 7's H1 read-out: how much export the robust interval policy B2 gives up, and how often the record-trusting policy B0 is unsafe, per network. n = 200 truth draws per cell; no uncertainty is drawn, because B2's and the oracle's exports are deterministic given the draw set and the loss is their difference. The second series is each network's companion model: U-T for the transformer-limited networks and U2 at w = 0.3 for the cable-limited ones, labelled per point. Source: results/eval_&lt;network&gt;_&lt;model&gt;.json, fields policies.B4.na.export_MWh.mean, policies.B2.na.export_MWh.mean and policies.B0.na.unsafe.share_draws_ge1. Contains information from SimBench (simbench.de), made available under the Open Database License (ODbL 1.0). See analysis/asset_rating_information/DATA_ATTRIBUTION.md.</desc>
