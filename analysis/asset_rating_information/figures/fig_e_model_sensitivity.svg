<svg xmlns="http://www.w3.org/2000/svg" width="1929" height="486" viewBox="0 0 1929 486" role="img">
<title>E - B6's recovery across the uncertainty models</title>
<desc>How B6's recovery depends on the uncertainty model, per cable-limited network, n = 200 truth draws. The three curves are B6 against its budget under U2, under U2 at w = 0.3 and under U3's discrete class ambiguity; B6 realises exactly k on these cells, so the budget is also its realised count. U4 is a single point, because the whole pool lies in one route there: verifying that one route unit resolves the network by construction, and the point is placed at its realised unit count with its segment count labelled. No uncertainty is drawn; the standard errors are in results/stage_a_summary.json, verification.&lt;network&gt;.&lt;model&gt;.R.B6. Source: results/eval_&lt;network&gt;_&lt;model&gt;.json, fields policies.B6.&lt;k&gt;.recovery.mean and policies.B6.&lt;k&gt;.realised_units.mean. Contains information from SimBench (simbench.de), made available under the Open Database License (ODbL 1.0). See analysis/asset_rating_information/DATA_ATTRIBUTION.md.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#000000}.fig{font-size:13px;font-weight:bold}.panel{font-size:11px;font-weight:bold}.axis{font-size:10px}.tick{font-size:9px}.legend{font-size:9px}.point{font-size:7.5px;fill:#404040}.note{font-size:8px;fill:#404040}</style>
