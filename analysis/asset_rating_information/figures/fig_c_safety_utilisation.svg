<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1854" height="486" viewBox="0 0 1854 486" role="img">
<title>C - Export against unsafe steps, per policy</title>
<desc>The safety-utilisation plane on the cable-limited networks under U2, n = 200 truth draws. y = the policy's mean export as a percentage of the oracle's (B4's); x = the mean share of E-steps that are unsafe. B0 trusts the record and buys its export with unsafe steps; B2 is safe and gives export up; B6 at k = 4 is the H5(c) cell, which buys most of the gap back with four verifications and no unsafe step. No uncertainty is drawn: these are the means of the two read-outs. Source: results/eval_&lt;network&gt;_U2.json, fields policies.&lt;policy&gt;.&lt;budget&gt;.export_MWh.mean and policies.&lt;policy&gt;.&lt;budget&gt;.unsafe.unsafe_step_share. Contains information from SimBench (simbench.de), made available under the Open Database License (ODbL 1.0). See analysis/asset_rating_information/DATA_ATTRIBUTION.md.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#000000}.fig{font-size:13px;font-weight:bold}.panel{font-size:11px;font-weight:bold}.axis{font-size:10px}.tick{font-size:9px}.legend{font-size:9px}.point{font-size:7.5px;fill:#404040}.note{font-size:8px;fill:#404040}</style>
