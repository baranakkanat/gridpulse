<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1394" height="487" viewBox="0 0 1394 487" role="img">
<title>F - A rating-only change is invisible; an impedance change is not</title>
<desc>Protocol s. 8's Controls D and E, which together carry H2. Control D changes one cable's rating alone and the electrical state does not move: the largest absolute change in res_bus.vm_pu and in res_line.i_ka is exactly 0, at n = 2 AC solves on one network, so electrical data carry no information about a rating-only error. Control E changes an impedance as well as the rating, and the state does move: the voltage change is drawn as its 95th percentile and its maximum over every bus and step, and the left panel shows how often the resulting overload is invisible to the nominal model. No uncertainty is drawn; both controls are deterministic comparisons of complete cached years. Source: results/control_d.json, field rating_only_change.comparisons, and results/control_e_&lt;network&gt;.json, fields invisible_overload and distributions.vm_abs_delta_all_buses. Contains information from SimBench (simbench.de), made available under the Open Database License (ODbL 1.0). See analysis/asset_rating_information/DATA_ATTRIBUTION.md.</desc>
