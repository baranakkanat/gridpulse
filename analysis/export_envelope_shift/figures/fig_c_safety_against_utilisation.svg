<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1204" height="486" viewBox="0 0 1204 486" role="img">
<title>C - Safety against utilisation, every policy</title>
<desc>rural3, P1 and P3. x = the median over the 10 near conditions of the companion utilisation Sum(e)/Sum(e_B5), with utilisation 0 for an unsafe or degenerate record and a mean over replicates otherwise. y = the share of near conditions with an unsafe record in either replicate. Bars are Clopper-Pearson 95 % intervals with n = 10 conditions, the protocol's n (s. 9: replicates are nested). A and A' are regime-independent references and so repeat across both panels; CERT, ALWAYS and RAND are replicate-0 policies over B2 and B2p. Source: results/envelopes_rural3.json, results/oracle_rural3.json, runs/oracle_rural3.npz and results/ambiguity_rural3.json (policies). Contains information from SimBench (simbench.de), made available under the Open Database License (ODbL 1.0). See analysis/export_envelope_shift/DATA_ATTRIBUTION.md.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#000000}.fig{font-size:13px;font-weight:bold}.panel{font-size:11px;font-weight:bold}.axis{font-size:10px}.tick{font-size:9px}.legend{font-size:9px}.point{font-size:7.5px;fill:#404040}.note{font-size:8px;fill:#404040}</style>
