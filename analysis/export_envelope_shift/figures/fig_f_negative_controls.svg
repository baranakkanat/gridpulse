<svg xmlns="http://www.w3.org/2000/svg" width="944" height="628" viewBox="0 0 944 628" role="img">
<title>F - Negative controls</title>
<desc>rural3. B2's unsafe-condition share under each negative control, beside the primary cell, and Method A against Method A'. Arms, left to right: B2 P1 primary; B2 P3 primary; D: B2 P1 far; H: T=192 P1; H: T=384 P1; H: T=768 P1; I: s=0.0005 P1; I: s=0.0005 P3; I: s=0.005 P1; I: s=0.005 P3; I: s=0.002 P1; I: s=0.002 P3; L0: B2 L0; T: full P1; T: full P3; A (AC offset); A' (train offset). y = the share of conditions with an unsafe record in any replicate. Bars are Clopper-Pearson 95 % intervals with n = the number of conditions (10 near, 10 far), the protocol's n. Control arms H and I carry replicate 0 only; the primary and control T arms carry both. The 17 arm labels are rotated 45 degrees, with the plot shortened to make room, so that none of them overlap. Source: results/envelopes_rural3.json and results/controls_rural3.json. Contains information from SimBench (simbench.de), made available under the Open Database License (ODbL 1.0). See analysis/export_envelope_shift/DATA_ATTRIBUTION.md.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#000000}.fig{font-size:13px;font-weight:bold}.panel{font-size:11px;font-weight:bold}.axis{font-size:10px}.tick{font-size:9px}.legend{font-size:9px}.point{font-size:7.5px;fill:#404040}.note{font-size:8px;fill:#404040}</style>
<text x="12" y="26" class="fig">F - Negative controls</text>
<text x="12" y="40" class="note">rural3. B2's unsafe-condition share under each negative control, beside the primary cell, and Method A against Method A'. Arms, left to right: B2 P1 primary; B2 P3 primary;</text>
