<svg xmlns="http://www.w3.org/2000/svg" width="854" height="528" viewBox="0 0 854 528" role="img">
<title>B - Prediction accuracy against decision safety</title>
<desc>H2's 9 voltage-model x regime cells. x = the mean over replicates of the test-day MAE of the noise-free predicted voltage against the AC truth on day 156 (96 steps). y = the share of near conditions with an unsafe record in at least one replicate. Bars are Clopper-Pearson 95 % intervals with n = the number of near conditions, the protocol's n (s. 9: replicates are nested), i.e. n = 10 on rural3 and n = 2 on semiurb5; this matches every interval in results/stage_a_summary.json. semiurb5 is drawn hollow and is descriptive (A2). Source: results/envelopes_&lt;network&gt;.json, fields fits[].test_mae and records[].unsafe. Contains information from SimBench (simbench.de), made available under the Open Database License (ODbL 1.0). See analysis/export_envelope_shift/DATA_ATTRIBUTION.md.</desc>
