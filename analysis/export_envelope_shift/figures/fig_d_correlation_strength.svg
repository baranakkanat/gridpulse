<svg xmlns="http://www.w3.org/2000/svg" width="824" height="517" viewBox="0 0 824 517" role="img">
<title>D - Unsafe rate against measured PV correlation</title>
<desc>rural3. x = the regime's measured mean pairwise PV correlation, so P3, P2 and P1 appear from low to high; L0 is drawn hollow because it shares P1's PV seeds and differs only in its training loads, and it carries R = 1. y = the mean over the 10 near conditions of u_i, itself the mean over replicates of unsafe(r, i). n = 10 conditions x 2 replicates per filled point, 10 x 1 per hollow point. No uncertainty band is drawn: the per-cell Clopper-Pearson intervals are in figures B and C and in results/stage_a_summary.json. Source: results/envelopes_rural3.json and results/physics_rural3_&lt;regime&gt;.json. Contains information from SimBench (simbench.de), made available under the Open Database License (ODbL 1.0). See analysis/export_envelope_shift/DATA_ATTRIBUTION.md.</desc>
